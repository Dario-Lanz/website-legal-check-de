<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Banner removes itself</title><style>body{margin:0;background:#0000ff}main{height:300px;color:#fff;padding:1em}footer{background:#00aa00;padding:2em 1em}</style></head><body>
<main><h1>Studio</h1></main>
<footer><a href="/impressum.html">Impressum</a></footer>
<div id="cookie-banner" role="dialog" style="position:fixed;bottom:0;left:0;right:0;height:100px;background:#ff0000;color:#fff;z-index:9999">
Wir verwenden Cookies und bitten um Ihre Einwilligung. <button>Alle akzeptieren</button> <button>Nur notwendige</button></div>
<script>const b=document.getElementById('cookie-banner');new MutationObserver(()=>{if(b.style.visibility==='hidden')b.remove()}).observe(b,{attributes:true});</script>
</body></html>
